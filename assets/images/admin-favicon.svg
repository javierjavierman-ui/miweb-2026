<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1109" />
      <stop offset="50%" stop-color="#2c1a0e" />
      <stop offset="100%" stop-color="#3d2514" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8a4" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8b6343" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#e8c97a" />
    </linearGradient>
    <filter id="adminDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo squircle redondeado oscuro institucional -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#adminBgGrad)" />

  <!-- Borde dorado doble -->
  <rect x="22" y="22" width="468" height="468" rx="102" ry="102" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />
  <rect x="36" y="36" width="440" height="440" rx="88" ry="88" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.4" />

  <!-- Engranaje / Símbolo de gestión en la parte superior central -->
  <g transform="translate(256, 120)" fill="url(#goldGrad)" opacity="0.9" filter="url(#adminDropShadow)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    <circle cx="0" cy="0" r="12" fill="#faf6f0" />
    <!-- Dientes del engranaje -->
    <rect x="-6" y="-38" width="12" height="12" rx="3" />
    <rect x="-6" y="26" width="12" height="12" rx="3" />
    <rect x="-38" y="-6" width="12" height="12" rx="3" />
    <rect x="26" y="-6" width="12" height="12" rx="3" />
    <rect x="-29" y="-29" width="12" height="12" rx="3" transform="rotate(45)" />
    <rect x="17" y="-29" width="12" height="12" rx="3" transform="rotate(45)" />
    <rect x="-29" y="17" width="12" height="12" rx="3" transform="rotate(45)" />
    <rect x="17" y="17" width="12" height="12" rx="3" transform="rotate(45)" />
  </g>

  <!-- Letras centrales "IA" en tipografía refinada (estilo Cinzel / Romana) -->
  <g filter="url(#adminDropShadow)">
    <!-- Letra I -->
    <path d="M 125 180 L 215 180 L 215 215 L 185 215 L 185 305 L 215 305 L 215 340 L 125 340 L 125 305 L 155 305 L 155 215 L 125 215 Z" fill="#faf6f0" />
    
    <!-- Letra A -->
    <path d="M 315 180 L 375 180 L 435 340 L 385 340 L 370 285 L 320 285 L 305 340 L 255 340 Z M 345 220 L 330 258 L 360 258 Z" fill="#faf6f0" />
  </g>

  <!-- Placa / Insignia "ADMIN" en la parte inferior -->
  <g filter="url(#adminDropShadow)">
    <rect x="110" y="375" width="292" height="66" rx="20" ry="20" fill="url(#badgeGrad)" stroke="#faf6f0" stroke-width="2" />
    <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="6" fill="#1b1109" text-anchor="middle">ADMIN</text>
  </g>
</svg>
