<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="webBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo squircle redondeado moderno -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#webBgGrad)" />
  
  <!-- Borde sutil brillante -->
  <rect x="17" y="17" width="478" height="478" rx="107" ry="107" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Constelación / Red neuronal sutil de fondo -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="3">
    <line x1="120" y1="130" x2="200" y2="90" />
    <line x1="200" y1="90" x2="312" y2="90" />
    <line x1="312" y1="90" x2="392" y2="130" />
    <circle cx="120" cy="130" r="7" fill="#ffffff" />
    <circle cx="200" cy="90" r="8" fill="#ffffff" />
    <circle cx="312" cy="90" r="8" fill="#ffffff" />
    <circle cx="392" cy="130" r="7" fill="#ffffff" />
  </g>

  <!-- Letras principales "IA" -->
  <g filter="url(#softGlow)">
    <!-- Letra I con remates elegantes -->
    <path d="M 120 160 L 210 160 L 210 200 L 180 200 L 180 340 L 210 340 L 210 380 L 120 380 L 120 340 L 150 340 L 150 200 L 120 200 Z" fill="#ffffff" />
    
    <!-- Letra A geométrica y moderna -->
    <path d="M 315 160 L 375 160 L 440 380 L 390 380 L 370 305 L 320 305 L 300 380 L 250 380 Z M 345 208 L 330 268 L 360 268 Z" fill="#ffffff" />
  </g>

  <!-- Chispa de Inteligencia / Estrella Dorada -->
  <path d="M 248 180 Q 248 215 220 215 Q 248 215 248 250 Q 248 215 276 215 Q 248 215 248 180 Z" fill="url(#sparkGrad)" filter="url(#softGlow)" />

  <!-- Arco de cercanía humana / conexión (sonrisa tecnológica) -->
  <path d="M 140 405 Q 256 460 372 405" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.9" />
</svg>
